<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PROTOCOL: LINGUA | BLACK MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background: #000; color: #00FF41; font-family: 'VT323', monospace; overflow: hidden; }
        .crt::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
        .scanline { width: 100%; height: 2px; background: rgba(0, 255, 65, 0.1); position: absolute; top: 0; z-index: 101; animation: scanline 8s linear infinite; }
        @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }
        .glitch-red { animation: shake 0.2s infinite; color: #ff0000 !important; }
        @keyframes shake { 0% { transform: translate(0,0); } 20% { transform: translate(-2px, 1px); } 100% { transform: translate(2px, -1px); } }
        #log-window::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="crt p-4">
    <div class="scanline"></div>

    <header class="border border-[#00FF41] p-2 mb-4 flex justify-between items-center text-sm">
        <div class="flex gap-4">
            <span id="xmr-ticker">XMR: $---</span>
            <span>OXYGEN: <span id="oxy-val">100</span>%</span>
        </div>
        <div class="text-right">
            <div>CASH: <span id="cash-val">500</span> $</div>
            <div>XMR: <span id="xmr-val">0.00</span> </div>
        </div>
    </header>

    <div id="log-window" class="h-[55vh] border border-[#00FF41] p-4 overflow-y-auto mb-4 bg-black/50 text-xl">
        <div id="logs" class="space-y-2"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="md:col-span-2 border border-[#00FF41] p-2 flex items-center">
            <span class="mr-2">INPUT></span>
            <input type="text" id="terminal-input" class="bg-transparent border-none outline-none text-[#00FF41] w-full" autofocus placeholder="메시지 전송...">
        </div>
        
        <div class="flex gap-2 md:col-span-2">
            <button onclick="trade('buy')" class="flex-1 border border-[#00FF41] hover:bg-[#00FF41] hover:text-black transition-all font-bold">BUY XMR (100$)</button>
            <button onclick="trade('sell')" class="flex-1 border border-[#00FF41] hover:bg-[#00FF41] hover:text-black transition-all font-bold">SELL ALL XMR</button>
        </div>
    </div>

    <script>
        let cash = 500;
        let xmrOwned = 0;
        let oxygen = 100;
        let xmrPrice = 240;

        // --- 무조건 번역 엔진 (어떤 한글도 에스페란토 느낌으로 변환) ---
        function universalTranslate(text) {
            const suffixes = ["on", "as", "is", "oj", "an", "en"];
            return text.split('').map((char, i) => {
                const code = char.charCodeAt(0);
                if (code >= 0xAC00 && code <= 0xD7AF) { // 한글인 경우
                    // 한글 유니코드를 기반으로 유사 에스페란토 단어 생성
                    const base = ["mi", "vi", "li", "si", "lo", "ka", "tu", "ne", "jes"][code % 9];
                    return (i % 3 === 0) ? " " + base : base[code % base.length];
                }
                return char;
            }).join('').trim() + suffixes[text.length % 6];
        }

        const input = document.getElementById('terminal-input');
        const logs = document.getElementById('logs');

        // 메시지 전송
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value) {
                const original = input.value;
                const translated = universalTranslate(original);
                
                const div = document.createElement('div');
                div.innerHTML = `
                    <span class="opacity-30">[${new Date().toLocaleTimeString()}]</span>
                    <span class="cursor-pointer hover:text-white" onclick="decode(this, '${original}')">${translated}</span>
                    <span class="text-[10px] opacity-20 ml-2">(CLICK TO DECODE: 0.01 XMR)</span>
                `;
                logs.appendChild(div);
                logs.parentElement.scrollTop = logs.parentElement.scrollHeight;
                
                input.value = '';
                oxygen = Math.min(100, oxygen + 5);
                updateUI();
            }
        });

        // 해독 기능
        function decode(el, original) {
            if (xmrOwned >= 0.01) {
                xmrOwned -= 0.01;
                el.innerText = ">> " + original;
                el.style.color = "white";
                updateUI();
            } else {
                alert("XMR 부족! 코인을 사야 해독할 수 있어.");
            }
        }

        // 간편 거래 기능
        function trade(type) {
            if (type === 'buy') {
                if (cash >= 100) {
                    cash -= 100;
                    xmrOwned += 100 / xmrPrice;
                } else { alert("현금이 부족해!"); }
            } else {
                if (xmrOwned > 0) {
                    cash += xmrOwned * xmrPrice;
                    xmrOwned = 0;
                }
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('cash-val').innerText = cash.toFixed(0);
            document.getElementById('xmr-val').innerText = xmrOwned.toFixed(4);
            document.getElementById('oxy-val').innerText = oxygen.toFixed(1);
            document.getElementById('xmr-ticker').innerText = `XMR: $${xmrPrice.toFixed(2)}`;
        }

        // 마켓 및 시스템 루프
        setInterval(() => {
            oxygen = Math.max(0, oxygen - 0.3);
            xmrPrice += (Math.random() - 0.5) * 4; // 가격 출렁임
            
            if (oxygen < 20) document.body.classList.add('glitch-red');
            else document.body.classList.remove('glitch-red');
            
            if (oxygen <= 0) logs.innerHTML = "<div class='text-red-500'>OXYGEN ZERO. DATA WIPED.</div>";
            
            updateUI();
        }, 2000);

        updateUI();
    </script>
</body>
</html>
